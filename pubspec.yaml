name: trilex
description: Trilex – curso de inglés de A1 a B2 con lecturas, libros y repaso.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_local_notifications: 17.2.4
  flutter_timezone: 3.0.1
  flutter_tts: ^4.2.0
  http: ^1.2.2
  path_provider: ^2.1.4
  record: ^7.1.2
  shared_preferences: ^2.3.2
  timezone: ^0.9.4
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
